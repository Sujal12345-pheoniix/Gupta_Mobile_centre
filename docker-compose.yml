version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: gupta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gupta_mobile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gupta_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./infrastructure/docker/api
    container_name: gupta_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gupta_mobile
      REDIS_URL: redis://redis:6379
      APP_ENV: development
      JWT_SECRET: dev-secret-key-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/usr/src/app
      - /usr/src/app/node_modules

  admin:
    build: ./infrastructure/docker/admin
    container_name: gupta_admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gupta_mobile
      REDIS_URL: redis://redis:6379
      APP_ENV: development
    ports:
      - "3001:3000"
    volumes:
      - ./apps/admin-web:/usr/src/app
      - /usr/src/app/node_modules

  redis-commander:
    image: rediscommander/rediscommander:latest
    container_name: gupta_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8081:8081"

volumes:
  postgres_data: